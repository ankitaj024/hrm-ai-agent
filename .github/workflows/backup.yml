name: MongoDB Backup to Google Drive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install MongoDB Tools
        run: |
          wget https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          tar -zxvf mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          sudo cp mongodb-database-tools-ubuntu2204-x86_64-100.9.4/bin/* /usr/local/bin/

      - name: Install Dependencies
        run: npm install googleapis dotenv mongodb

      - name: Create Backup Script
        run: |
          cat << 'EOF' > backup.js
          const { google } = require('googleapis');
          const fs = require('fs');
          const { execSync } = require('child_process');
          const path = require('path');

          async function runBackup() {
              const MONGO_URI = process.env.MONGO_URI;
              const FOLDER_ID = process.env.GDRIVE_FOLDER_ID;
              const CLIENT_ID = process.env.GDRIVE_CLIENT_ID;
              const CLIENT_SECRET = process.env.GDRIVE_CLIENT_SECRET;
              const REFRESH_TOKEN = process.env.GDRIVE_REFRESH_TOKEN;

              if (!MONGO_URI || !FOLDER_ID || !CLIENT_ID || !CLIENT_SECRET || !REFRESH_TOKEN) {
                  console.error('Missing required environment variables.');
                  process.exit(1);
              }

              const date = new Date().toISOString().replace(/[:.]/g, '-');
              const backupFileName = `backup-${date}.archive.gz`;
              const backupFilePath = path.join(__dirname, backupFileName);

              console.log('[1/3] Creating backup...');
              try {
                  // Run mongodump once for the whole database
                  execSync(`mongodump --uri="${MONGO_URI}" --archive="${backupFilePath}" --gzip`, { stdio: 'inherit' });
                  console.log(`Backup created at: ${backupFilePath}`);
              } catch (err) {
                  console.error('Failed to create backup:', err.message);
                  process.exit(1);
              }

              console.log('[2/3] Authenticating with Google Drive...');
              const auth = new google.auth.OAuth2(CLIENT_ID, CLIENT_SECRET);
              auth.setCredentials({ refresh_token: REFRESH_TOKEN });
              const drive = google.drive({ version: 'v3', auth });

              let uploadedFileId;

              try {
                  console.log(`Uploading to Google Drive Folder: ${FOLDER_ID}...`);
                  const response = await drive.files.create({
                      requestBody: {
                          name: backupFileName,
                          parents: [FOLDER_ID],
                      },
                      media: {
                          mimeType: 'application/gzip',
                          body: fs.createReadStream(backupFilePath),
                      },
                      fields: 'id'
                  });
                  uploadedFileId = response.data.id;
                  console.log(`SUCCESS! Uploaded File ID: ${uploadedFileId}`);
              } catch (error) {
                  console.error('Upload Failed:', error.message);
                  if (fs.existsSync(backupFilePath)) fs.unlinkSync(backupFilePath);
                  process.exit(1);
              }

              console.log('[3/3] Creating Retention Policy (Deleting old backups)...');
              try {
                  const listRes = await drive.files.list({
                      q: `'${FOLDER_ID}' in parents and trashed = false`,
                      fields: 'files(id, name, createdTime)',
                  });

                  const files = listRes.data.files || [];
                  console.log(`Found ${files.length} total files in folder.`);

                  let deletedCount = 0;
                  for (const file of files) {
                      if (file.id !== uploadedFileId) {
                          console.log(`Deleting old backup: ${file.name} (${file.id})...`);
                          await drive.files.delete({ fileId: file.id });
                          deletedCount++;
                      }
                  }
                  console.log(`Retention policy applied. Deleted ${deletedCount} old files.`);

              } catch (error) {
                  console.error('Warning: Failed to cleanup old backups:', error.message);
                  // Do not fail the build just because cleanup failed, as backup is safe
              }

              // Cleanup local file
              if (fs.existsSync(backupFilePath)) fs.unlinkSync(backupFilePath);
              console.log('Done.');
          }

          runBackup();
          EOF

      - name: Run Backup Script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node backup.js
